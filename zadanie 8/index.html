<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wprowadzenie</title>
    <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous"></script>
    <script>
        $(function(){

            $("#zmien").click(function(){
                $("#tekst").text("Nowy tekst")
            })
            
            $("#przelacz").click(function(){
                $("#pudelko").toggle()
            })

            $(".akapit").click(function(){
                $(this).toggleClass("podswietlony")
            })

            $("#przywitaj").click(function(){
                let asd = $("#imie").val();
                if(asd.length != 0){
                    $("#wynik").text("Cześć "+asd)
                }else{
                    $("#wynik").text("Podaj imie")
                }
        })

            $("#akceptuje").on("change",function(){
                if(this.checked){
                    $("#wyslij").removeAttr("disabled")
                }else{
                    $("#wyslij").attr("disabled","disabled")
                }
            })

             $("li").each(function(index,element){
                $(element).text((index + 1) + "." + $(element).text())
            })

            $("#zaloguj").click(function(){
                let asd = $("#login").val();
                let qwe = $("#haslo").val();
                if(asd.length >= 3 && qwe.length >= 6){
                    $("#komunikat").text("Zalogowano").css("color","green")
                }else{
                    $("#komunikat").text("ŻLE").css("color","red")
                }
        })
        })
    </script>
    <style>
        body {
            padding: 20px;
            background-color: #f5f5f5;
        }
        .podswietlony{
            background-color: rgba(233, 233, 102, 0.726);
        }
    </style>
</head>
<body>
     <p id="tekst">Stary teskt</p>
     <button id="zmien">ZMIEN</button></body></html>
     <div id="pudelko">Widzisz mnie</div>
     <button id="przelacz">Pokaż/ukryj</button>
     <p class="akapit">NWM</p>

     <input type="text" id="imie">
     <button id="przywitaj">przywitaj</button>
     <p id="wynik"></p>

     <input type="checkbox" id="akceptuje">Akceptuj
     <button id="wyslij" disabled>Wyslij</button>

     <ul id="menu">
        <li>Strona głowna</li>
        <li>O nas</li>
        <li>Kontakt</li>
     </ul>

     <input type="text" id="login">
     <input type="password" id="haslo">
     <button id="zaloguj">Zaloguj</button>
     <p id="komunikat"></p>
</body>
</html>
